[package]
name = "ai-agent"
version = "0.1.0"
edition = "2024"

[[example]]
name = "stream_chat"
path = "examples/stream_chat.rs"

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.42.2", features = ["chat-completion"] }
async-stream = "0.3.6"
backon = "1.6.0"
dotenvy = "0.15.7"
futures = "0.3.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
